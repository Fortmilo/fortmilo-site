name: Update current document versions

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace old document references everywhere
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          workflow_path = ".github/workflows/update-current-doc-versions.yml"
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          replacements = {
              "evidence-semantics-and-scanner-orchestration-v1.4.pdf":
                  "evidence-semantics-and-scanner-orchestration-v1.4.9.pdf",
              "orchestrating-ai-for-secure-software-delivery-v1.0.pdf":
                  "orchestrating-ai-for-secure-software-delivery-v1.0.4.pdf",
              "The technical whitepaper listed above is the current guidance. Older versioned PDFs may remain reachable for archival integrity, but they are not current guidance.":
                  "The technical whitepaper listed above is the current published guidance. Previous versions have been replaced and are no longer published on this site.",
          }

          for relative in tracked:
              if relative == workflow_path:
                  continue
              path = Path(relative)
              if not path.is_file() or path.suffix.lower() in {".pdf", ".png", ".jpg", ".jpeg", ".ico"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              text = re.sub(
                  r"Evidence Semantics and Scanner Orchestration v1\.4(?!\.)",
                  "Evidence Semantics and Scanner Orchestration v1.4.9",
                  text,
              )
              text = re.sub(
                  r"Orchestrating AI for Secure Software Delivery v1\.0(?!\.)",
                  "Orchestrating AI for Secure Software Delivery v1.0.4",
                  text,
              )
              if relative == "site-src/site-map.mjs":
                  text = text.replace(
                      '{ output: "documents/index.html", canonical: "https://fortmilo.co.uk/documents/", lastmod: "2026-08-10", corporateActive: "documents" }',
                      '{ output: "documents/index.html", canonical: "https://fortmilo.co.uk/documents/", lastmod: "2026-08-11", corporateActive: "documents" }',
                  )
              if text != original:
                  path.write_text(text, encoding="utf-8")

      - name: Remove temporary workflow
        run: git rm .github/workflows/update-current-doc-versions.yml

      - name: Confirm old references are gone
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          failures = []
          for relative in tracked:
              path = Path(relative)
              if not path.is_file() or path.suffix.lower() in {".pdf", ".png", ".jpg", ".jpeg", ".ico"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if "evidence-semantics-and-scanner-orchestration-v1.4.pdf" in text:
                  failures.append(f"{relative}: old technical whitepaper filename")
              if "orchestrating-ai-for-secure-software-delivery-v1.0.pdf" in text:
                  failures.append(f"{relative}: old methodology filename")
              if re.search(r"Evidence Semantics and Scanner Orchestration v1\.4(?!\.)", text):
                  failures.append(f"{relative}: old technical whitepaper display version")
              if re.search(r"Orchestrating AI for Secure Software Delivery v1\.0(?!\.)", text):
                  failures.append(f"{relative}: old methodology display version")
          if failures:
              raise SystemExit("\n".join(failures))

          required = [
              Path("documents/evidence-semantics-and-scanner-orchestration-v1.4.9.pdf"),
              Path("documents/orchestrating-ai-for-secure-software-delivery-v1.0.4.pdf"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Missing current PDFs: " + ", ".join(missing))

      - name: Build and validate site
        run: npm run check

      - name: Diff safety check
        run: git diff --check

      - name: Commit current document references
        run: |
          git config user.name "FortMilo site validation"
          git config user.email "info@fortmilo.co.uk"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Point site to current document versions"
          git push origin HEAD:main
