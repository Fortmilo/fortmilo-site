name: Validate public site

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and validate
        run: npm run check

      - name: Assert accessible methodology publication
        run: npm run validate:ai-methodology

      - name: Preserve first publication inventory
        run: cp _publication/inventory.json /tmp/publication-inventory-first.json

      - name: Rebuild and revalidate publication artifact
        run: |
          npm run build:publication
          npm run validate:publication

      - name: Verify deterministic publication inventory
        run: cmp --silent /tmp/publication-inventory-first.json _publication/inventory.json

      - name: Verify clean generated output
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
