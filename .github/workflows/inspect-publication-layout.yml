name: Inspect publication layout

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  inspect-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python -m pip install --quiet pymupdf
      - name: Print target text blocks
        shell: python
        run: |
          import pymupdf
          targets = [
              ('documents/evidence-semantics-and-scanner-orchestration-v1.4.9.pdf', [0, 8]),
              ('documents/orchestrating-ai-for-secure-software-delivery-v1.0.4.pdf', [23]),
          ]
          needles = ('Publication continuity', 'Archived public editions', 'FortMilo, Orchestrating AI', 'FortMilo, Evidence Semantics', 'Each URL is printed')
          for path, pages in targets:
              doc = pymupdf.open(path)
              print(f'=== {path} ===')
              for pageno in pages:
                  page = doc[pageno]
                  print(f'-- PAGE {pageno + 1} size={page.rect} --')
                  data = page.get_text('dict')
                  for block in data['blocks']:
                      if 'lines' not in block:
                          continue
                      text = ' '.join(''.join(span['text'] for span in line['spans']) for line in block['lines'])
                      if any(n.lower() in text.lower() for n in needles):
                          print(f'BLOCK bbox={block["bbox"]}: {text}')
                          for line in block['lines']:
                              for span in line['spans']:
                                  print(f'  SPAN bbox={span["bbox"]} size={span["size"]} font={span["font"]!r}: {span["text"]!r}')
              doc.close()
      - run: git rm -f .github/workflows/inspect-publication-layout.yml
      - name: Commit workflow cleanup
        run: |
          git config user.name "FortMilo publication inspection"
          git config user.email "info@fortmilo.co.uk"
          git commit -m "Remove temporary publication layout workflow"
          git push origin HEAD:main
