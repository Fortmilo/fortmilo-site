name: Apply product overview funnel cleanup

on:
  push:
    branches:
      - agent/product-overview-funnel-cleanup-20260815
    paths:
      - .github/workflows/apply-overview-funnel-cleanup.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/product-overview-funnel-cleanup-20260815
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply bounded page-body and source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}")
              p.write_text(text.replace(old, new))

          overview = Path("security-observatory/index.html")
          text = overview.read_text()
          old_hero = '''<main id="main"><section class="page-hero"><div class="container hero-grid"><div><p class="eyebrow">Security Observatory by FortMilo</p><h1>Evidence organised for review.</h1><p class="lead">Security Observatory collects Salesforce security evidence, preserves provenance and presents focused review areas without exposing sensitive raw credential material. Automatic assessment and retained product evidence remain inside Salesforce; a user-initiated sanitised CSV download is a separate export boundary.</p></div><aside class="evidence-panel"><p>Product boundaries</p><ul class="fact-list"><li><strong>Runs inside Salesforce</strong><span>LWC, Apex and Salesforce data storage; explicit user export is a separate boundary.</span></li><li><strong>Read-only assessment</strong><span>The Observatory is advisory. It does not remediate or modify the Salesforce security configuration it assesses. Product-owned records retain scan results, evidence, findings and comparison data.</span></li><li><strong>Evidence-bounded</strong><span>Unavailable sources and validation limits remain visible.</span></li><li><strong>Sandbox-first</strong><span>Not yet available for public installation.</span></li></ul></aside></div></section><section class="section"><div class="container"><div class="section-heading"><p class="section-label">Product guide</p><h2>Overview plus five review areas</h2><p>Explore each documented review area without exposing organisation data or evidence values. The product source supporting source-established public claims is privately maintained; validation against the release build and target environment is stated separately.</p></div><div class="card-grid card-grid-five">'''
          new_hero = '''<main id="main"><section class="page-hero"><div class="container hero-grid product-overview-hero"><div><p class="eyebrow">Security Observatory by FortMilo</p><h1>Everything you need to review, in one place.</h1><p class="lead">Six review areas covering findings, identity, external connections, entitlements and the evidence behind them. Assessment and retained evidence stay inside Salesforce.</p></div><!-- Dashboard screenshot slot: insert the approved sanitised product capture here when available. --></div></section><section class="section"><div class="container"><div class="section-heading"><p class="section-label">Product guide</p><h2>Overview plus five review areas</h2><p>Each review area shows what the Observatory surfaces and how far the evidence goes.</p></div><div class="card-grid card-grid-five">'''
          if text.count(old_hero) != 1:
              raise SystemExit("overview: hero contract mismatch")
          text = text.replace(old_hero, new_hero)
          old_end = '''</article></div></div></section></main>'''
          new_end = '''</article></div><aside class="evidence-panel product-boundaries-panel"><p>Product boundaries</p><ul class="fact-list"><li><strong>Runs inside Salesforce</strong><span>LWC, Apex and Salesforce data storage; explicit user export is a separate boundary.</span></li><li><strong>Read-only assessment</strong><span>The Observatory is advisory. It does not remediate or modify the Salesforce security configuration it assesses. Product-owned records retain scan results, evidence, findings and comparison data.</span></li><li><strong>Evidence-bounded</strong><span>Unavailable sources and validation limits remain visible.</span></li><li><strong>Sandbox-first</strong><span>Not yet available for public installation.</span></li></ul></aside></div></section></main>'''
          if text.count(old_end) != 1:
              raise SystemExit("overview: end contract mismatch")
          overview.write_text(text.replace(old_end, new_end))

          replace(
              "security-observatory/evidence.html",
              '<p class="lead">Security Observatory uses evidence-bounded terminology and does not assert that a Security Benchmark for Salesforce (SBS) control is satisfied. The product implementation source supporting source-established statements is privately maintained; those statements remain self-attested unless a public artefact is cited. Validation against the release build and target environment is stated separately rather than implied.</p>',
              '<p class="lead">Evidence state, coverage and limitation answer different questions, and the Observatory keeps them separate. Security Observatory uses evidence-bounded terminology and does not assert that a Security Benchmark for Salesforce (SBS) control is satisfied. The product implementation source supporting source-established statements is privately maintained; those statements remain self-attested unless a public artefact is cited. Validation against the release build and target environment is stated separately rather than implied.</p>'
          )
          replace(
              "security-observatory/identity-access.html",
              '<p class="lead">Inspect identity posture, login evidence and broad access signals without changing user access. Session identifiers are never displayed. Raw IP values are omitted or redacted; exact retained-data shape is validated per environment.</p>',
              '<p class="lead">Inspect identity posture, login evidence and broad access signals without changing user access.</p>'
          )
          replace(
              "security-observatory/entitlements-assets.html",
              '<p class="lead">Review licence usage, broad permissions and governed asset context without automatically removing access or changing commercial assignments. Running-user sharing, CRUD and field-level-security behaviour must be validated against the target release build, environment and user personas before being claimed.</p>',
              '<p class="lead">Review licence usage, broad permissions and governed asset context without automatically removing access or changing commercial assignments.</p>'
          )
          replace(
              "site-src/styles.css",
              '.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 470px); align-items: center; gap: 3.25rem; padding-block: 3.4rem; }',
              '.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 470px); align-items: center; gap: 3.25rem; padding-block: 3.4rem; }\n.product-overview-hero { grid-template-columns: minmax(0, 1fr); }'
          )
          replace(
              "site-src/styles.css",
              '.evidence-panel > p { margin: 0 0 .8rem; color: #c8d1de; font-size: .75rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }',
              '.evidence-panel > p { margin: 0 0 .8rem; color: #c8d1de; font-size: .75rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }\n.product-boundaries-panel { margin-top: 1.5rem; }'
          )

          site_map = Path("site-src/site-map.mjs")
          sm = site_map.read_text()
          date_replacements = {
              '{ output: "security-observatory/index.html", canonical: "https://fortmilo.co.uk/security-observatory/", lastmod: "2026-08-15"': '{ output: "security-observatory/index.html", canonical: "https://fortmilo.co.uk/security-observatory/", lastmod: "2026-08-15"',
              '{ output: "security-observatory/identity-access.html", canonical: "https://fortmilo.co.uk/security-observatory/identity-access.html", lastmod: "2026-08-11"': '{ output: "security-observatory/identity-access.html", canonical: "https://fortmilo.co.uk/security-observatory/identity-access.html", lastmod: "2026-08-15"',
              '{ output: "security-observatory/entitlements-assets.html", canonical: "https://fortmilo.co.uk/security-observatory/entitlements-assets.html", lastmod: "2026-08-10"': '{ output: "security-observatory/entitlements-assets.html", canonical: "https://fortmilo.co.uk/security-observatory/entitlements-assets.html", lastmod: "2026-08-15"',
              '{ output: "security-observatory/evidence.html", canonical: "https://fortmilo.co.uk/security-observatory/evidence.html", lastmod: "2026-08-15"': '{ output: "security-observatory/evidence.html", canonical: "https://fortmilo.co.uk/security-observatory/evidence.html", lastmod: "2026-08-15"',
          }
          for old, new in date_replacements.items():
              if sm.count(old) != 1:
                  raise SystemExit(f"site map contract mismatch: {old}")
              sm = sm.replace(old, new)
          site_map.write_text(sm)

          validator = Path("scripts/validate-site.mjs")
          v = validator.read_text()
          old_overview = '''const overview = htmlByRoute.get("security-observatory/index.html") || "";
          requireAll(overview, [
            "collects Salesforce security evidence",
            "Read-only assessment",
            "The Observatory is advisory. It does not remediate or modify the Salesforce security configuration it assesses.",
            "Product-owned records retain scan results, evidence, findings and comparison data."
          ], "security-observatory/index.html");
          prohibitAll(overview, ["collects read-only Salesforce evidence", "Read-only and advisory"], "security-observatory/index.html");'''.replace("          ", "")
          new_overview = '''const overview = htmlByRoute.get("security-observatory/index.html") || "";
          requireAll(overview, [
            "<h1>Everything you need to review, in one place.</h1>",
            '<p class="lead">Six review areas covering findings, identity, external connections, entitlements and the evidence behind them. Assessment and retained evidence stay inside Salesforce.</p>',
            "Each review area shows what the Observatory surfaces and how far the evidence goes.",
            "Dashboard screenshot slot: insert the approved sanitised product capture here when available.",
            "Product boundaries",
            "Read-only assessment",
            "The Observatory is advisory. It does not remediate or modify the Salesforce security configuration it assesses.",
            "Product-owned records retain scan results, evidence, findings and comparison data."
          ], "security-observatory/index.html");
          prohibitAll(overview, [
            "Evidence organised for review.",
            "Security Observatory collects Salesforce security evidence, preserves provenance",
            "Explore each documented review area without exposing organisation data or evidence values.",
            "The product source supporting source-established public claims is privately maintained; validation against the release build and target environment is stated separately.",
            "Read-only and advisory"
          ], "security-observatory/index.html");
          if (!(overview.indexOf("Overview plus five review areas") < overview.indexOf("Product boundaries"))) errors.push("security-observatory/index.html: product boundaries must follow review-area cards");'''.replace("          ", "")
          if v.count(old_overview) != 1:
              raise SystemExit("validator overview contract mismatch")
          v = v.replace(old_overview, new_overview)

          old_evidence_tail = '''  "Illustrative evidence state"
          ], "security-observatory/evidence.html");'''.replace("          ", "")
          new_evidence_tail = '''  "Illustrative evidence state",
            "Evidence state, coverage and limitation answer different questions, and the Observatory keeps them separate.",
            "The product implementation source supporting source-established statements is privately maintained; those statements remain self-attested unless a public artefact is cited."
          ], "security-observatory/evidence.html");'''.replace("          ", "")
          if v.count(old_evidence_tail) != 1:
              raise SystemExit("validator evidence contract mismatch")
          v = v.replace(old_evidence_tail, new_evidence_tail)

          old_identity = '''const identity = htmlByRoute.get("security-observatory/identity-access.html") || "";
          const identityBoundary = "Session identifiers are never displayed. Raw IP values are omitted or redacted; exact retained-data shape is validated per environment.";
          if (count(identity, identityBoundary) !== 2) errors.push("identity-access.html: expected customer-facing identity boundary twice");
          if (identity.includes("complete retained-data and export-shape validation remains environment-specific")) errors.push("identity-access.html: evidence-register wording returned");'''.replace("          ", "")
          new_identity = '''const identity = htmlByRoute.get("security-observatory/identity-access.html") || "";
          const identityBoundary = "Session identifiers are never displayed. Raw IP values are omitted or redacted; exact retained-data shape is validated per environment.";
          requireAll(identity, ['<p class="lead">Inspect identity posture, login evidence and broad access signals without changing user access.</p>'], "security-observatory/identity-access.html");
          if (count(identity, identityBoundary) !== 1) errors.push("identity-access.html: expected identity qualification once below hero");
          if (identity.includes("complete retained-data and export-shape validation remains environment-specific")) errors.push("identity-access.html: evidence-register wording returned");'''.replace("          ", "")
          if v.count(old_identity) != 1:
              raise SystemExit("validator identity contract mismatch")
          v = v.replace(old_identity, new_identity)

          marker = 'const documents = htmlByRoute.get("documents/index.html") || "";'
          entitlements_contract = '''const entitlements = htmlByRoute.get("security-observatory/entitlements-assets.html") || "";
          requireAll(entitlements, [
            '<p class="lead">Review licence usage, broad permissions and governed asset context without automatically removing access or changing commercial assignments.</p>',
            "Validation against the target release build, environment and user personas remains the boundary for running-user sharing, CRUD and field-level-security claims."
          ], "security-observatory/entitlements-assets.html");
          prohibitAll(entitlements, ["Running-user sharing, CRUD and field-level-security behaviour must be validated against the target release build, environment and user personas before being claimed.</p>"], "security-observatory/entitlements-assets.html");

          '''.replace("          ", "")
          if v.count(marker) != 1:
              raise SystemExit("validator documents marker mismatch")
          v = v.replace(marker, entitlements_contract + marker)
          validator.write_text(v)
          PY
      - name: Build and validate
        run: npm run check
      - name: Check patch integrity
        run: git diff --check
      - name: Commit validated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tighten Security Observatory product funnel"
          git push
