name: Apply approved public site update

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-approved-site-update.mjs
      - .github/workflows/apply-approved-site-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Apply, validate and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout main
          node scripts/apply-approved-site-update.mjs
          rm scripts/apply-approved-site-update.mjs .github/workflows/apply-approved-site-update.yml
          npm run check
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align public site naming, accessibility and footer"
          git push origin HEAD:main
