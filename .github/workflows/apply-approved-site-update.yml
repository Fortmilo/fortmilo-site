name: Apply approved public site update

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-approved-site-update.mjs
      - .github/workflows/apply-approved-site-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply approved update
        run: node scripts/apply-approved-site-update.mjs

      - name: Remove one-time automation
        run: rm scripts/apply-approved-site-update.mjs .github/workflows/apply-approved-site-update.yml

      - name: Build and validate all routes
        run: npm run check

      - name: Check patch integrity
        run: git diff --check

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align public site naming, accessibility and footer"
          git push origin HEAD:main
