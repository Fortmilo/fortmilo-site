name: Request GitHub Pages rebuild

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate all public routes
        run: npm run validate

      - name: Request and verify Pages build from configured source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          echo "Pages request: ${response}"

          for attempt in $(seq 1 60); do
            latest=$(curl --fail-with-body --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest")
            status=$(printf '%s' "${latest}" | jq -r '.status')
            commit=$(printf '%s' "${latest}" | jq -r '.commit // "unknown"')
            echo "Pages build attempt ${attempt}: status=${status} commit=${commit}"
            case "${status}" in
              built)
                exit 0
                ;;
              errored|cancelled)
                printf '%s\n' "${latest}"
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Timed out waiting for GitHub Pages build"
          exit 1
