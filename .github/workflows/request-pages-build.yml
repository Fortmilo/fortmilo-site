name: Validate and rebuild GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: branch-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate all public routes
        run: npm run validate

      - name: Request Pages build and verify the live domain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          echo "Pages request: ${response}"

          built=false
          for attempt in $(seq 1 60); do
            latest=$(curl --fail-with-body --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest")
            status=$(printf '%s' "${latest}" | jq -r '.status')
            commit=$(printf '%s' "${latest}" | jq -r '.commit // "unknown"')
            echo "Pages build attempt ${attempt}: status=${status} commit=${commit}"
            case "${status}" in
              built)
                built=true
                break
                ;;
              errored|cancelled)
                printf '%s\n' "${latest}"
                exit 1
                ;;
            esac
            sleep 5
          done

          if [ "${built}" != "true" ]; then
            echo "Timed out waiting for GitHub Pages build"
            exit 1
          fi

          for attempt in $(seq 1 60); do
            nonce="${GITHUB_RUN_ID}-${attempt}"
            home=$(curl --fail --silent --show-error --location \
              --header "Cache-Control: no-cache" \
              "https://fortmilo.co.uk/?deployment=${nonce}")
            overview=$(curl --fail --silent --show-error --location \
              --header "Cache-Control: no-cache" \
              "https://fortmilo.co.uk/security-observatory/?deployment=${nonce}")
            architecture=$(curl --fail --silent --show-error --location \
              --header "Cache-Control: no-cache" \
              "https://fortmilo.co.uk/architecture-security.html?deployment=${nonce}")
            sitemap=$(curl --fail --silent --show-error --location \
              --header "Cache-Control: no-cache" \
              "https://fortmilo.co.uk/sitemap.xml?deployment=${nonce}")

            if printf '%s' "${home}" | grep -Fq "Security Observatory brings OAuth grants" \
              && printf '%s' "${home}" | grep -Fq "Request access when available" \
              && printf '%s' "${home}" | grep -Fq 'href="/acknowledgements.html">Acknowledgements' \
              && ! printf '%s' "${home}" | grep -Fq "FortMilo Security Observatory brings" \
              && printf '%s' "${overview}" | grep -Fq "<h1>Security Observatory</h1>" \
              && printf '%s' "${overview}" | grep -Fq "Five review areas" \
              && printf '%s' "${architecture}" | grep -Fq "No security remediation or write-back to assessed Salesforce configuration." \
              && [ "$(printf '%s' "${sitemap}" | grep -Fc '<lastmod>2026-08-19</lastmod>')" -eq 13 ]; then
              echo "Verified corrected content on https://fortmilo.co.uk/"
              exit 0
            fi

            echo "Live verification attempt ${attempt}: previous Pages content still visible"
            sleep 5
          done

          echo "Timed out waiting for corrected content on the public domain"
          exit 1
