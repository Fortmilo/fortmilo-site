name: Publish Evidence Semantics PDF v1.1.0

on:
  push:
    branches:
      - main
    paths:
      - scripts/publish-evidence-v1.1.0.py

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install document dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer fonts-liberation fonts-crosextra-carlito fonts-noto-core
          python -m pip install --disable-pip-version-check pypdf

      - name: Rebuild the reviewed versioned PDF
        run: python scripts/publish-evidence-v1.1.0.py

      - name: Validate published PDFs
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from pypdf import PdfReader

          expected = {
              "documents/evidence-semantics-and-scanner-orchestration.pdf",
              "documents/evidence-semantics-and-scanner-orchestration-v1.1.0.pdf",
          }
          digests = set()
          for filename in expected:
              path = Path(filename)
              if not path.exists() or path.stat().st_size < 100000:
                  raise SystemExit(f"Missing or unexpectedly small PDF: {path}")
              data = path.read_bytes()
              if not data.startswith(b"%PDF-"):
                  raise SystemExit(f"Invalid PDF header: {path}")
              digests.add(sha256(data).hexdigest())
              reader = PdfReader(str(path))
              if len(reader.pages) != 16:
                  raise SystemExit(f"Unexpected page count for {path}: {len(reader.pages)}")
              metadata = reader.metadata or {}
              if metadata.get("/Author") != "Luca Pacini":
                  raise SystemExit(f"Unexpected author for {path}: {metadata.get('/Author')}")
              if metadata.get("/Version") != "1.1.0":
                  raise SystemExit(f"Unexpected version for {path}: {metadata.get('/Version')}")
              if metadata.get("/SourceBaseline") != "f834844b":
                  raise SystemExit(f"Unexpected source baseline for {path}: {metadata.get('/SourceBaseline')}")
              print(f"Validated {path}: 16 pages, Luca Pacini, version 1.1.0")
          if len(digests) != 1:
              raise SystemExit("Stable and versioned PDF files are not identical")
          PY

      - name: Commit published PDFs and remove one-time files
        run: |
          git add documents/evidence-semantics-and-scanner-orchestration.pdf
          git add documents/evidence-semantics-and-scanner-orchestration-v1.1.0.pdf
          git rm scripts/publish-evidence-v1.1.0.py
          git rm .github/workflows/publish-evidence-v1.1.0.yml
          git rm .tmp/evidence-v1.1.0-final.docx.b64.part-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish Evidence Semantics paper version 1.1.0"
          git push origin HEAD:main
