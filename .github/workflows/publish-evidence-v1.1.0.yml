name: Publish Evidence Semantics PDF v1.1.0

on:
  push:
    branches:
      - main
    paths:
      - scripts/publish-evidence-v1.1.0.py

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pypdf

      - name: Publish stable and versioned PDFs
        run: python scripts/publish-evidence-v1.1.0.py

      - name: Validate published PDFs
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader

          expected = {
              "documents/evidence-semantics-and-scanner-orchestration.pdf",
              "documents/evidence-semantics-and-scanner-orchestration-v1.1.0.pdf",
          }
          for filename in expected:
              path = Path(filename)
              if not path.exists() or path.stat().st_size < 100000:
                  raise SystemExit(f"Missing or unexpectedly small PDF: {path}")
              reader = PdfReader(str(path))
              if len(reader.pages) != 16:
                  raise SystemExit(f"Unexpected page count for {path}: {len(reader.pages)}")
              metadata = reader.metadata or {}
              if metadata.get("/Author") != "Luca Pacini":
                  raise SystemExit(f"Unexpected author for {path}: {metadata.get('/Author')}")
              if metadata.get("/Version") != "1.1.0":
                  raise SystemExit(f"Unexpected version for {path}: {metadata.get('/Version')}")
              print(f"Validated {path}: 16 pages, author Luca Pacini, version 1.1.0")
          PY

      - name: Commit published PDFs and remove one-time files
        run: |
          git add documents/evidence-semantics-and-scanner-orchestration.pdf
          git add documents/evidence-semantics-and-scanner-orchestration-v1.1.0.pdf
          git rm scripts/publish-evidence-v1.1.0.py
          git rm .github/workflows/publish-evidence-v1.1.0.yml
          git rm .tmp/evidence-v1.1.0.part-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish Evidence Semantics paper version 1.1.0"
          git push origin HEAD:main
