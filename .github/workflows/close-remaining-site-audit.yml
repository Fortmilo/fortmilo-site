name: Close remaining site audit findings

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply agreed site fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path_str, old, new, expected=1):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f'{path_str}: expected {expected} occurrence(s), found {count}: {old!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          # Remove the unused public reference SVG rather than rehabilitating obsolete claims.
          orphan = Path('documents/security-observatory-reference-architecture.svg')
          if not orphan.is_file():
              raise RuntimeError('Expected orphan reference architecture SVG to exist before cleanup')
          orphan.unlink()

          # Architecture copy: customer-facing release language, permanent PDF version rule and label legibility.
          replace_exact(
              'architecture-security.html',
              'Subscriber-owned authentication; running-user sharing, CRUD and field-level-security behaviour remains subject to exact-candidate persona validation.',
              'Subscriber-owned authentication; running-user sharing, CRUD and field-level-security behaviour must be validated against the target release build, environment and user personas before being claimed.'
          )
          replace_exact(
              'architecture-security.html',
              'The Documents page identifies the current published version.',
              'The version is recorded inside the PDF.'
          )
          replace_exact(
              'architecture-security.html',
              '<text x="555" y="305">retains evidence</text><text x="285" y="305">review relationship</text>',
              '<text x="555" y="390">retains evidence</text><text x="285" y="390">review relationship</text>'
          )
          replace_exact(
              'architecture-security.html',
              '<text x="880" y="126">callout endpoint</text>',
              '<text x="880" y="90">callout endpoint</text>'
          )
          replace_exact(
              'architecture-security.html',
              '<text x="880" y="296">principal access</text>',
              '<text x="880" y="245">principal access</text>'
          )
          replace_exact(
              'architecture-security.html',
              '<text x="880" y="476">OAuth client registration</text>',
              ''
          )

          # Remove internal release-engineering shorthand from customer-facing pages without removing the caveat.
          replace_exact(
              'security-observatory/entitlements-assets.html',
              'Running-user sharing, CRUD and field-level-security behaviour remains subject to exact-candidate persona validation for the claimed environment.',
              'Running-user sharing, CRUD and field-level-security behaviour must be validated against the target release build, environment and user personas before being claimed.'
          )
          replace_exact(
              'security-observatory/entitlements-assets.html',
              'Exact-candidate persona validation remains the boundary for running-user sharing, CRUD and field-level-security claims.',
              'Validation against the target release build, environment and user personas remains the boundary for running-user sharing, CRUD and field-level-security claims.'
          )
          replace_exact(
              'security-observatory/index.html',
              'The product source supporting source-established public claims is privately maintained; exact-candidate and environment-specific validation is stated separately.',
              'The product source supporting source-established public claims is privately maintained; validation against the release build and target environment is stated separately.'
          )
          replace_exact(
              'security-observatory/evidence.html',
              'Exact-candidate and environment-specific validation is stated separately rather than implied.',
              'Validation against the release build and target environment is stated separately rather than implied.'
          )
          replace_exact(
              'security-observatory/evidence.html',
              'Running-user sharing, CRUD and field-level-security behaviour, complete raw-IP data-shape handling and environment compatibility remain separate exact-candidate or environment-specific validation questions.',
              'Running-user sharing, CRUD and field-level-security behaviour, complete raw-IP data-shape handling and environment compatibility remain separate validation questions for the release build and target environment.'
          )

          # Bound the quantified SBS mapping claim to FortMilo's retained local catalogue.
          replace_exact(
              'security-observatory/evidence.html',
              'The current catalogue is bound to SBS version v0.4.0, mapping set M1, revision 1. Mapping is recorded per control; domain and category labels support grouping and review rather than replacing that per-control record.',
              'The current catalogue is bound to SBS version v0.4.0, mapping set M1, revision 1. Mapping is recorded per control; domain and category labels support grouping and review rather than replacing that per-control record. These figures describe FortMilo’s retained SBS mapping catalogue for mapping set M1 revision 1; they do not assert completeness or equivalence to the current upstream SBS release.'
          )

          # Make the canonical contract self-contained and remove discretionary audit wording.
          replace_exact(
              'EVIDENCE_TERMINOLOGY_CONTRACT.md',
              'It is reserved only for the bounded **EV-04 retained-evidence read warning** where a retained-evidence read itself cannot establish the expected value. Any such use must remain explicitly scoped to that warning condition.',
              'It is reserved only for the bounded retained-evidence read warning used when a retained-evidence read itself cannot establish the expected value. This is the **EV-04** condition in the supporting assurance record. Any such use must remain explicitly scoped to that warning condition.'
          )
          replace_exact(
              'EVIDENCE_TERMINOLOGY_CONTRACT.md',
              '4. The Salesforce implementation and relevant validators are checked for conformity.\n5. Any affected technical publication is checked for conformity.\n6. All identified deltas are resolved before the changed terminology is published as current.',
              '4. The Salesforce implementation and validators are checked for conformity.\n5. Technical publications identified as conforming artefacts in section 7 are checked for conformity.\n6. The conformity determination for each artefact is recorded before the changed terminology is published or released.\n7. All identified deltas are resolved before the changed terminology is published as current.'
          )

          # Make CSS filenames truly content-addressed on every build.
          build_path = Path('scripts/build-site.mjs')
          build = build_path.read_text(encoding='utf-8')
          old_build = '''const existingCssNames = (await readdir(assetsDirectory)).filter((name) => /^site\\.[a-f0-9]{12}\\.css$/u.test(name));
          let cssFile;
          for (const name of existingCssNames) {
            if ((await readFile(path.join(assetsDirectory, name), "utf8")) === styles) {
              cssFile = `assets/${name}`;
              break;
            }
          }
          if (!cssFile) {
            const hash = createHash("sha256").update(styles).digest("hex").slice(0, 12);
            cssFile = `assets/site.${hash}.css`;
            await writeFile(path.join(root, cssFile), styles);
          }

          const existingHomeCssNames = (await readdir(assetsDirectory)).filter((name) => /^home\\.[a-f0-9]{12}\\.css$/u.test(name));
          let homeCssFile;
          for (const name of existingHomeCssNames) {
            if ((await readFile(path.join(assetsDirectory, name), "utf8")) === homeStyles) {
              homeCssFile = `assets/${name}`;
              break;
            }
          }
          if (!homeCssFile) {
            const hash = createHash("sha256").update(homeStyles).digest("hex").slice(0, 12);
            homeCssFile = `assets/home.${hash}.css`;
            await writeFile(path.join(root, homeCssFile), homeStyles);
          }'''
          new_build = '''const existingCssNames = (await readdir(assetsDirectory)).filter((name) => /^site\\.[a-f0-9]{12}\\.css$/u.test(name));
          const cssHash = createHash("sha256").update(styles).digest("hex").slice(0, 12);
          const cssFile = `assets/site.${cssHash}.css`;
          await writeFile(path.join(root, cssFile), styles);

          const existingHomeCssNames = (await readdir(assetsDirectory)).filter((name) => /^home\\.[a-f0-9]{12}\\.css$/u.test(name));
          const homeCssHash = createHash("sha256").update(homeStyles).digest("hex").slice(0, 12);
          const homeCssFile = `assets/home.${homeCssHash}.css`;
          await writeFile(path.join(root, homeCssFile), homeStyles);'''
          if build.count(old_build) != 1:
              raise RuntimeError('scripts/build-site.mjs: expected legacy CSS selection block exactly once')
          build_path.write_text(build.replace(old_build, new_build), encoding='utf-8')

          # Harden the validator around content hashes, public document allow-list and generic versioned paths.
          validator_path = Path('scripts/validate-site.mjs')
          validator = validator_path.read_text(encoding='utf-8')

          old_css_validation = '''if (cssFiles.length === 1) {
            const generatedCss = await readText(cssFiles[0]);
            if (generatedCss !== sourceCss) errors.push(`${cssFiles[0]} does not match site-src/styles.css`);
          }

          const homeCssFiles = allFiles.filter((file) => /^assets\\/home\\.[a-f0-9]{12}\\.css$/u.test(file));
          if (homeCssFiles.length !== 1) errors.push(`expected one generated home CSS file, found ${homeCssFiles.length}`);
          const homeSourceCss = await readText("site-src/home.css");
          if (homeCssFiles.length === 1) {
            const generatedHomeCss = await readText(homeCssFiles[0]);
            if (generatedHomeCss !== homeSourceCss) errors.push(`${homeCssFiles[0]} does not match site-src/home.css`);
          }'''
          new_css_validation = '''if (cssFiles.length === 1) {
            const generatedCss = await readText(cssFiles[0]);
            if (generatedCss !== sourceCss) errors.push(`${cssFiles[0]} does not match site-src/styles.css`);
            const expectedHash = createHash("sha256").update(generatedCss).digest("hex").slice(0, 12);
            const actualHash = cssFiles[0].match(/^assets\\/site\\.([a-f0-9]{12})\\.css$/u)?.[1];
            if (actualHash !== expectedHash) errors.push(`${cssFiles[0]}: filename hash does not match content digest ${expectedHash}`);
          }

          const homeCssFiles = allFiles.filter((file) => /^assets\\/home\\.[a-f0-9]{12}\\.css$/u.test(file));
          if (homeCssFiles.length !== 1) errors.push(`expected one generated home CSS file, found ${homeCssFiles.length}`);
          const homeSourceCss = await readText("site-src/home.css");
          if (homeCssFiles.length === 1) {
            const generatedHomeCss = await readText(homeCssFiles[0]);
            if (generatedHomeCss !== homeSourceCss) errors.push(`${homeCssFiles[0]} does not match site-src/home.css`);
            const expectedHomeHash = createHash("sha256").update(generatedHomeCss).digest("hex").slice(0, 12);
            const actualHomeHash = homeCssFiles[0].match(/^assets\\/home\\.([a-f0-9]{12})\\.css$/u)?.[1];
            if (actualHomeHash !== expectedHomeHash) errors.push(`${homeCssFiles[0]}: filename hash does not match content digest ${expectedHomeHash}`);
          }'''
          if validator.count(old_css_validation) != 1:
              raise RuntimeError('scripts/validate-site.mjs: expected CSS validation block exactly once')
          validator = validator.replace(old_css_validation, new_css_validation)

          old_documents_prohibit = '''prohibitAll(documents, [
            "Evidence Semantics and Scanner Orchestration v1.4.9",
            "Orchestrating AI for Secure Software Delivery v1.0.4",
            "evidence-semantics-and-scanner-orchestration-v1.4.9.pdf",
            "orchestrating-ai-for-secure-software-delivery-v1.0.4.pdf",
            "Publication status:",
            "Previous versions",
            "Older versioned PDFs"
          ], "documents/index.html");'''
          new_documents_prohibit = '''prohibitAll(documents, [
            "Publication status:",
            "Previous versions",
            "Older versioned PDFs"
          ], "documents/index.html");
          if (/href="\\/documents\\/[^"]*-v\\d+(?:\\.\\d+)*\\.pdf"/iu.test(documents)) errors.push("documents/index.html: versioned public PDF href must not be published");
          if (/<h2>[^<]*\\bv\\d+(?:\\.\\d+)+\\b[^<]*<\\/h2>/iu.test(documents)) errors.push("documents/index.html: document heading must not expose a version number");'''
          if validator.count(old_documents_prohibit) != 1:
              raise RuntimeError('scripts/validate-site.mjs: expected old Documents deny-list exactly once')
          validator = validator.replace(old_documents_prohibit, new_documents_prohibit)

          old_obsolete = '''for (const obsoletePdf of [
            "documents/evidence-semantics-and-scanner-orchestration-v1.4.9.pdf",
            "documents/orchestrating-ai-for-secure-software-delivery-v1.0.4.pdf"
          ]) {
            if (fileSet.has(obsoletePdf)) errors.push(`versioned public PDF must not be published: ${obsoletePdf}`);
          }

          for (const pdf of ['''
          new_obsolete = '''const allowedDocumentFiles = [
            "documents/evidence-semantics-and-scanner-orchestration.pdf",
            "documents/index.html",
            "documents/orchestrating-ai-for-secure-software-delivery.pdf"
          ];
          const publicDocumentFiles = allFiles.filter((file) => file.startsWith("documents/")).sort();
          if (JSON.stringify(publicDocumentFiles) !== JSON.stringify(allowedDocumentFiles)) {
            errors.push(`documents/: public artefact allow-list mismatch: ${publicDocumentFiles.join(", ")}`);
          }
          for (const file of publicDocumentFiles) {
            if (/^documents\\/.*-v\\d+(?:\\.\\d+)*\\.pdf$/iu.test(file)) errors.push(`versioned public PDF must not be published: ${file}`);
          }

          for (const pdf of ['''
          if validator.count(old_obsolete) != 1:
              raise RuntimeError('scripts/validate-site.mjs: expected literal obsolete-PDF guard exactly once')
          validator = validator.replace(old_obsolete, new_obsolete)

          # Enforce the customer-facing language and the bounded SBS statement we just corrected.
          marker = 'const terminologyConsumers = ['
          global_guard = '''for (const [route, html] of htmlByRoute) {
            if (html.includes("exact-candidate")) errors.push(`${route}: internal exact-candidate wording must not be public`);
          }

          '''
          if validator.count(marker) != 1:
              raise RuntimeError('scripts/validate-site.mjs: terminology consumer marker not found exactly once')
          validator = validator.replace(marker, global_guard + marker)

          evidence_marker = '"They cannot be compared with v1.0 scans",'
          evidence_extra = '"These figures describe FortMilo’s retained SBS mapping catalogue for mapping set M1 revision 1; they do not assert completeness or equivalence to the current upstream SBS release.",\n  '
          if validator.count(evidence_marker) != 1:
              raise RuntimeError('scripts/validate-site.mjs: evidence requirement marker not found exactly once')
          validator = validator.replace(evidence_marker, evidence_extra + evidence_marker)

          architecture_marker = '"Unavailable evidence remains visible and explained.",'
          architecture_extra = '"The version is recorded inside the PDF.",\n  '
          if validator.count(architecture_marker) != 1:
              raise RuntimeError('scripts/validate-site.mjs: architecture requirement marker not found exactly once')
          validator = validator.replace(architecture_marker, architecture_marker + '\n  ' + architecture_extra.strip())

          contract_marker = '"**Status:** Canonical",'
          contract_extra = '''"This is the **EV-04** condition in the supporting assurance record.",
            "4. The Salesforce implementation and validators are checked for conformity.",
            "5. Technical publications identified as conforming artefacts in section 7 are checked for conformity.",
            "6. The conformity determination for each artefact is recorded before the changed terminology is published or released.",'''
          if validator.count(contract_marker) != 1:
              raise RuntimeError('scripts/validate-site.mjs: contract requirement marker not found exactly once')
          validator = validator.replace(contract_marker, contract_marker + '\n  ' + contract_extra.replace('\n', '\n  '))

          validator_path.write_text(validator, encoding='utf-8')

      - name: Remove temporary workflow
        run: git rm -f .github/workflows/close-remaining-site-audit.yml

      - name: Full site build and validation
        run: npm run check

      - name: Additional regression gates
        shell: bash
        run: |
          set -euo pipefail
          test ! -e documents/security-observatory-reference-architecture.svg
          test -f documents/evidence-semantics-and-scanner-orchestration.pdf
          test -f documents/orchestrating-ai-for-secure-software-delivery.pdf
          test "$(find documents -maxdepth 1 -type f | sort | wc -l)" -eq 3
          ! grep -R -n --exclude='*.pdf' --exclude-dir=.git 'exact-candidate' .
          ! find documents -maxdepth 1 -type f -regextype posix-extended -regex '.*-v[0-9]+(\.[0-9]+)*\.pdf' | grep -q .
          grep -q 'These figures describe FortMilo’s retained SBS mapping catalogue' security-observatory/evidence.html
          grep -q 'The version is recorded inside the PDF.' architecture-security.html
          grep -q 'Every conforming artefact identified in section 7 is audited' EVIDENCE_TERMINOLOGY_CONTRACT.md
          grep -q 'conformity determination for each artefact is recorded' EVIDENCE_TERMINOLOGY_CONTRACT.md
          test -f assets/site.bb099a1c36a5.css
          test ! -e assets/site.d494cf785e7f.css
          git diff --check

      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FortMilo site validation"
          git config user.email "info@fortmilo.co.uk"
          git add -A
          git commit -m "Close remaining public site audit findings"
          git push origin HEAD:main
