name: Apply permanent publication URLs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install PDF tooling
        run: python -m pip install --quiet pymupdf

      - name: Rewrite publications and public references
        shell: python
        run: |
          from pathlib import Path
          import pymupdf

          docs = Path('documents')
          tech_old = docs / 'evidence-semantics-and-scanner-orchestration-v1.4.9.pdf'
          tech_new = docs / 'evidence-semantics-and-scanner-orchestration.pdf'
          method_old = docs / 'orchestrating-ai-for-secure-software-delivery-v1.0.4.pdf'
          method_new = docs / 'orchestrating-ai-for-secure-software-delivery.pdf'

          tech_old_url = 'https://fortmilo.co.uk/documents/orchestrating-ai-for-secure-software-delivery/'
          tech_new_url = 'https://fortmilo.co.uk/documents/orchestrating-ai-for-secure-software-delivery.pdf'
          method_old_url = 'https://fortmilo.co.uk/documents/evidence-semantics-and-scanner-orchestration/'
          method_new_url = 'https://fortmilo.co.uk/documents/evidence-semantics-and-scanner-orchestration.pdf'

          def one_rect(page, text):
              matches = page.search_for(text)
              if len(matches) != 1:
                  raise RuntimeError(f'Expected one text match for {text!r}; found {len(matches)}')
              return matches[0]

          def queue_replace(page, old, new, font, size):
              rect = one_rect(page, old)
              page.add_redact_annot(
                  pymupdf.Rect(rect.x0 - 0.4, rect.y0 - 0.3, rect.x1 + 0.4, rect.y1 + 0.3),
                  fill=(1, 1, 1),
              )
              return rect, new, font, size

          def remove_uri(page, uri):
              links = [link for link in page.get_links() if link.get('uri') == uri]
              if len(links) != 1:
                  raise RuntimeError(f'Expected one URI annotation for {uri}; found {len(links)}')
              rect = pymupdf.Rect(links[0]['from'])
              page.delete_link(links[0])
              return rect

          def apply_replacements(page, replacements):
              page.apply_redactions()
              for rect, text, font, size in replacements:
                  page.insert_text(
                      pymupdf.Point(rect.x0, rect.y1 - 1.9),
                      text,
                      fontname=font,
                      fontsize=size,
                      color=(0, 0, 0),
                  )

          def insert_uri(page, old_rect, uri, font, size):
              width = pymupdf.get_text_length(uri, fontname=font, fontsize=size)
              rect = pymupdf.Rect(old_rect.x0, old_rect.y0, old_rect.x0 + width, old_rect.y1)
              page.insert_link({'kind': pymupdf.LINK_URI, 'from': rect, 'uri': uri})

          # Technical paper.
          tech = pymupdf.open(tech_old)
          page = tech[0]
          blocks = [
              block for block in page.get_text('blocks')
              if 'Publication continuity.' in block[4] and 'Archived public editions' in block[4]
          ]
          if len(blocks) != 1:
              raise RuntimeError(f'Expected one publication-continuity block; found {len(blocks)}')
          x0, y0, x1, y1 = blocks[0][:4]
          page.add_redact_annot(pymupdf.Rect(x0 - .5, y0 - .5, x1 + .5, y1 + .5), fill=(1, 1, 1))
          page.apply_redactions()

          page = tech[8]
          replacements = [
              queue_replace(
                  page,
                  '12. FortMilo, Orchestrating AI for Secure Software Delivery, current edition (v1.0.4 at the date of this publication), 2026.',
                  '12. FortMilo, Orchestrating AI for Secure Software Delivery, 2026.',
                  'Times-Roman', 8.0,
              ),
              queue_replace(page, tech_old_url, tech_new_url, 'Times-Roman', 8.0),
              queue_replace(
                  page,
                  'Each URL is printed in full so the references remain usable in printed and archived copies.',
                  'Each URL is printed in full so the references remain usable in printed copies.',
                  'Helvetica', 7.6,
              ),
          ]
          link_rect = remove_uri(page, tech_old_url)
          apply_replacements(page, replacements)
          insert_uri(page, link_rect, tech_new_url, 'Times-Roman', 8.0)
          tech.save(tech_new, garbage=4, deflate=True, clean=True)
          tech.close()

          # Methodology paper. Keep unrelated engineering uses of "superseded" intact.
          method = pymupdf.open(method_old)
          page = method[23]
          replacements = [
              queue_replace(
                  page,
                  '18. FortMilo, Evidence Semantics and Scanner Orchestration, current edition (v1.4.9 at the date of this publication), 2026.',
                  '18. FortMilo, Evidence Semantics and Scanner Orchestration, 2026.',
                  'Times-Roman', 8.0,
              ),
              queue_replace(page, method_old_url, method_new_url, 'Times-Roman', 8.0),
              queue_replace(
                  page,
                  'Each URL is printed in full so the references remain usable in printed and archived copies.',
                  'Each URL is printed in full so the references remain usable in printed copies.',
                  'Helvetica', 7.6,
              ),
          ]
          link_rect = remove_uri(page, method_old_url)
          apply_replacements(page, replacements)
          insert_uri(page, link_rect, method_new_url, 'Times-Roman', 8.0)
          method.save(method_new, garbage=4, deflate=True, clean=True)
          method.close()

          tech_old.unlink()
          method_old.unlink()

          # Documents page: no public version labels or publication-history wording.
          page_path = docs / 'index.html'
          html = page_path.read_text(encoding='utf-8')
          replacements = {
              '<h2>Evidence Semantics and Scanner Orchestration v1.4.9</h2>': '<h2>Evidence Semantics and Scanner Orchestration</h2>',
              'href="/documents/evidence-semantics-and-scanner-orchestration-v1.4.9.pdf"': 'href="/documents/evidence-semantics-and-scanner-orchestration.pdf"',
              '<p class="publication-status"><strong>Publication status:</strong> The technical whitepaper listed above is the current published guidance. Previous versions have been replaced and are no longer published on this site.</p>': '',
              '<h2>Orchestrating AI for Secure Software Delivery v1.0.4</h2>': '<h2>Orchestrating AI for Secure Software Delivery</h2>',
              'href="/documents/orchestrating-ai-for-secure-software-delivery-v1.0.4.pdf"': 'href="/documents/orchestrating-ai-for-secure-software-delivery.pdf"',
          }
          for old, new in replacements.items():
              if html.count(old) != 1:
                  raise RuntimeError(f'Documents page expected one occurrence of {old!r}')
              html = html.replace(old, new)
          page_path.write_text(html, encoding='utf-8')

          # Terminology contract cross-reference.
          contract_path = Path('EVIDENCE_TERMINOLOGY_CONTRACT.md')
          contract = contract_path.read_text(encoding='utf-8')
          old = '3. Every consuming surface listed in section 7 is audited against the new contract.'
          new = '3. Every conforming artefact identified in section 7 is audited against the new contract.'
          if contract.count(old) != 1:
              raise RuntimeError('Terminology contract section-8 sentence not found exactly once')
          contract_path.write_text(contract.replace(old, new), encoding='utf-8')

          # Site validator follows the permanent publication contract.
          validator_path = Path('scripts/validate-site.mjs')
          validator = validator_path.read_text(encoding='utf-8')
          replacements = {
              '"Evidence Semantics and Scanner Orchestration v1.4.9"': '"Evidence Semantics and Scanner Orchestration"',
              "'href=\"/documents/evidence-semantics-and-scanner-orchestration-v1.4.9.pdf\"'": "'href=\"/documents/evidence-semantics-and-scanner-orchestration.pdf\"'",
              '"Orchestrating AI for Secure Software Delivery v1.0.4"': '"Orchestrating AI for Secure Software Delivery"',
              "'href=\"/documents/orchestrating-ai-for-secure-software-delivery-v1.0.4.pdf\"'": "'href=\"/documents/orchestrating-ai-for-secure-software-delivery.pdf\"'",
              '"documents/evidence-semantics-and-scanner-orchestration-v1.4.9.pdf"': '"documents/evidence-semantics-and-scanner-orchestration.pdf"',
              '"documents/orchestrating-ai-for-secure-software-delivery-v1.0.4.pdf"': '"documents/orchestrating-ai-for-secure-software-delivery.pdf"',
          }
          for old, new in replacements.items():
              if old not in validator:
                  raise RuntimeError(f'Validator reference not found: {old!r}')
              validator = validator.replace(old, new)

          doc_marker = 'if (count(documents, \'class="card technical-resource"\') !== 2) errors.push("documents/index.html: expected two resource cards");'
          doc_gate = '''\nprohibitAll(documents, [\n  "Evidence Semantics and Scanner Orchestration v1.4.9",\n  "Orchestrating AI for Secure Software Delivery v1.0.4",\n  "evidence-semantics-and-scanner-orchestration-v1.4.9.pdf",\n  "orchestrating-ai-for-secure-software-delivery-v1.0.4.pdf",\n  "Publication status:",\n  "Previous versions",\n  "Older versioned PDFs"\n], "documents/index.html");'''
          if validator.count(doc_marker) != 1:
              raise RuntimeError('Documents validator marker not found exactly once')
          validator = validator.replace(doc_marker, doc_marker + doc_gate)

          pdf_marker = 'for (const pdf of [\n  "documents/evidence-semantics-and-scanner-orchestration.pdf",\n  "documents/orchestrating-ai-for-secure-software-delivery.pdf"\n]) {'
          old_file_gate = '''for (const obsoletePdf of [\n  "documents/evidence-semantics-and-scanner-orchestration-v1.4.9.pdf",\n  "documents/orchestrating-ai-for-secure-software-delivery-v1.0.4.pdf"\n]) {\n  if (fileSet.has(obsoletePdf)) errors.push(`versioned public PDF must not be published: ${obsoletePdf}`);\n}\n\n'''
          if validator.count(pdf_marker) != 1:
              raise RuntimeError('Permanent PDF validator marker not found exactly once')
          validator_path.write_text(validator.replace(pdf_marker, old_file_gate + pdf_marker), encoding='utf-8')

      - name: Validate publication PDF contract
        shell: python
        run: |
          from pathlib import Path
          import pymupdf

          specs = [
              (Path('documents/evidence-semantics-and-scanner-orchestration.pdf'), 9, 'v1.4.9',
               'https://fortmilo.co.uk/documents/orchestrating-ai-for-secure-software-delivery.pdf',
               'https://fortmilo.co.uk/documents/orchestrating-ai-for-secure-software-delivery/', [0, 8]),
              (Path('documents/orchestrating-ai-for-secure-software-delivery.pdf'), 25, 'v1.0.4',
               'https://fortmilo.co.uk/documents/evidence-semantics-and-scanner-orchestration.pdf',
               'https://fortmilo.co.uk/documents/evidence-semantics-and-scanner-orchestration/', [23]),
          ]
          for path, pages, version, new_url, old_url, changed_pages in specs:
              doc = pymupdf.open(path)
              if doc.page_count != pages:
                  raise SystemExit(f'Unexpected page count for {path}')
              text = '\n'.join(page.get_text('text') for page in doc)
              for required in (version, new_url, 'Each URL is printed in full so the references remain usable in printed copies.', 'EV-01', 'EV-04'):
                  if required not in text:
                      raise SystemExit(f'{path}: missing {required!r}')
              for prohibited in (old_url, 'printed and archived copies'):
                  if prohibited in text:
                      raise SystemExit(f'{path}: prohibited {prohibited!r}')
              uris = [link.get('uri') for page in doc for link in page.get_links() if link.get('uri')]
              if new_url not in uris or old_url in uris:
                  raise SystemExit(f'{path}: companion link annotation is not permanent')
              for pageno in changed_pages:
                  pix = doc[pageno].get_pixmap(matrix=pymupdf.Matrix(1, 1), alpha=False)
                  if pix.width < 500 or pix.height < 700 or not pix.samples:
                      raise SystemExit(f'{path}: render check failed on page {pageno + 1}')
              doc.close()

          with pymupdf.open(specs[0][0]) as doc:
              text = '\n'.join(page.get_text('text') for page in doc)
              for prohibited in ('Publication continuity', 'Archived public editions', 'archived editions', 'current edition (v1.0.4 at the date of this publication)'):
                  if prohibited in text:
                      raise SystemExit(f'Technical paper still contains {prohibited!r}')

          with pymupdf.open(specs[1][0]) as doc:
              text = '\n'.join(page.get_text('text') for page in doc)
              if 'current edition (v1.4.9 at the date of this publication)' in text:
                  raise SystemExit('Methodology paper still pins companion publication version')

          for obsolete in (
              Path('documents/evidence-semantics-and-scanner-orchestration-v1.4.9.pdf'),
              Path('documents/orchestrating-ai-for-secure-software-delivery-v1.0.4.pdf'),
          ):
              if obsolete.exists():
                  raise SystemExit(f'Versioned public file still exists: {obsolete}')

      - name: Remove temporary workflow
        run: git rm -f .github/workflows/apply-permanent-publication-urls.yml

      - name: Build and validate site
        run: npm run check

      - name: Repository diff check
        run: git diff --check

      - name: Commit permanent publication contract
        run: |
          git config user.name "FortMilo publication validation"
          git config user.email "info@fortmilo.co.uk"
          git add -A
          git commit -m "Use permanent public document URLs"
          git push origin HEAD:main
