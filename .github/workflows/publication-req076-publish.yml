name: Publish verified REQ-076 technical papers

on:
  push:
    branches:
      - publication-req076-publish-2026-08-19

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v6
        with:
          ref: publication-req076-publish-2026-08-19
          fetch-depth: 0

      - name: Verify current public PDF baselines
        run: |
          echo '437eafc184b18b0c3ce413705a183289d4c754cc665df1567a60c8e407719eda  documents/orchestrating-ai-for-secure-software-delivery.pdf' | sha256sum -c -
          echo '0c47ad471a8cfeb8b283566662a82f8b5f4754340aaf6ff95c81ad4baecf8f73  documents/evidence-semantics-and-scanner-orchestration.pdf' | sha256sum -c -

      - name: Download exact successful private publication build
        env:
          PUBLICATION_ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-fca8-81f4-ad2c-9e5515a5d2da/raw?se=2026-08-19T15%3A42%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=4be1001b-847e-5461-8088-88bcb487676b&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-19T07%3A57%3A09Z&ske=2026-08-20T07%3A57%3A09Z&sks=b&skv=2026-02-06&sig=C6F3nLh1/M6NWgSuljDpBwObX8hLMa9qGrAEdFgDl4g%3D'
        run: |
          curl --fail --location --silent --show-error "$PUBLICATION_ARTIFACT_URL" --output /tmp/req076-final-publications.zip
          echo 'f09d20355053f00f64d105ca13ded1aa71c5b1d4f41fa9fd6899cda10b35a472  /tmp/req076-final-publications.zip' | sha256sum -c -
          rm -rf /tmp/req076-final-publications
          mkdir -p /tmp/req076-final-publications
          unzip -q /tmp/req076-final-publications.zip -d /tmp/req076-final-publications

      - name: Verify and install exact successful PDFs
        run: |
          echo 'b5a7270765ed297f04d1746d254932e36e8f83940bff00356de32ec14664be55  /tmp/req076-final-publications/orchestrating-ai-for-secure-software-delivery.pdf' | sha256sum -c -
          echo 'ab38c8498fd4f29e4d069c67802524f6b6a1f344c35dcab2821209c142357cc5  /tmp/req076-final-publications/evidence-semantics-and-scanner-orchestration.pdf' | sha256sum -c -
          cp /tmp/req076-final-publications/orchestrating-ai-for-secure-software-delivery.pdf documents/orchestrating-ai-for-secure-software-delivery.pdf
          cp /tmp/req076-final-publications/evidence-semantics-and-scanner-orchestration.pdf documents/evidence-semantics-and-scanner-orchestration.pdf
          echo 'b5a7270765ed297f04d1746d254932e36e8f83940bff00356de32ec14664be55  documents/orchestrating-ai-for-secure-software-delivery.pdf' | sha256sum -c -
          echo 'ab38c8498fd4f29e4d069c67802524f6b6a1f344c35dcab2821209c142357cc5  documents/evidence-semantics-and-scanner-orchestration.pdf' | sha256sum -c -

      - name: Validate complete public site
        run: node scripts/validate-site.mjs

      - name: Remove temporary publication transport
        run: |
          rm -rf .publication-publish
          rm -f .github/workflows/publication-req076-publish.yml

      - name: Commit only verified public PDFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          changed=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' 'documents/evidence-semantics-and-scanner-orchestration.pdf' 'documents/orchestrating-ai-for-secure-software-delivery.pdf' | sort)
          test "$changed" = "$expected"
          git commit -m 'Publish REQ-076 corrected technical papers'
          git push origin HEAD:publication-req076-publish-2026-08-19
