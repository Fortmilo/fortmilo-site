name: Publish Evidence Semantics PDF v1.3

on:
  push:
    branches:
      - main
    paths:
      - .tmp/v13c.trigger

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and validate PDF
        run: |
          mkdir -p documents
          cat .tmp/v13c.part-* .tmp/v13c.tail-* | tr -d '\n\r' | base64 --decode > documents/evidence-semantics-and-scanner-orchestration.pdf
          echo "3acbd6f17284c3a706e0219062a4a5dfaea284f5a315d79f973d29d6ffce566b  documents/evidence-semantics-and-scanner-orchestration.pdf" | sha256sum -c -
          cp documents/evidence-semantics-and-scanner-orchestration.pdf documents/evidence-semantics-and-scanner-orchestration-v1.3.pdf
          test "$(head -c 5 documents/evidence-semantics-and-scanner-orchestration.pdf)" = "%PDF-"
          grep -aq "Luca Pacini" documents/evidence-semantics-and-scanner-orchestration.pdf
          grep -aq "Version 1.3" documents/evidence-semantics-and-scanner-orchestration.pdf
          cmp documents/evidence-semantics-and-scanner-orchestration.pdf documents/evidence-semantics-and-scanner-orchestration-v1.3.pdf

      - name: Commit publication and remove temporary files
        run: |
          git add documents/evidence-semantics-and-scanner-orchestration.pdf
          git add documents/evidence-semantics-and-scanner-orchestration-v1.3.pdf
          git rm .tmp/v13c.part-* .tmp/v13c.tail-* .tmp/v13c.trigger
          git rm .tmp/evidence-v1.3.part-* || true
          git rm .github/workflows/publish-evidence-v1.3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish Evidence Semantics paper version 1.3"
          git push origin HEAD:main
