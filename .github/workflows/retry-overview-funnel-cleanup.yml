name: Retry product overview funnel cleanup

on:
  push:
    branches:
      - agent/product-overview-funnel-cleanup-20260815
    paths:
      - .github/workflows/retry-overview-funnel-cleanup.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/product-overview-funnel-cleanup-20260815
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply bounded migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-overview-funnel-cleanup.mjs')
          lines = p.read_text().splitlines()
          lines = [line for line in lines if 'noop guard' not in line]
          p.write_text('\n'.join(lines) + '\n')
          PY
          node scripts/apply-overview-funnel-cleanup.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/validate-site.mjs')
          text = p.read_text()
          old = '  "Evidence organised for review.",\n'
          if text.count(old) != 1:
              raise SystemExit(f'validator old-H1 guard mismatch: {text.count(old)}')
          p.write_text(text.replace(old, ''))
          PY
      - name: Build and validate
        run: npm run check
      - name: Check patch integrity
        run: git diff --check
      - name: Remove temporary migration files
        run: |
          rm -f scripts/apply-overview-funnel-cleanup.mjs
          rm -f .github/workflows/apply-overview-funnel-cleanup.yml
          rm -f .github/workflows/retry-overview-funnel-cleanup.yml
      - name: Commit validated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tighten Security Observatory product funnel"
          git push
