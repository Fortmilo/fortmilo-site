<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Authority, contribution and evidence separation</title><desc id="desc">Human authority sits above AI contribution and evidence. Arrows show that AI and evidence inform human adjudication but never receive release authority.</desc>
  <rect width="1200" height="560" rx="28" fill="#f2f6fa"/><g font-family="Arial, Helvetica, sans-serif" text-anchor="middle"><rect x="230" y="35" width="740" height="130" rx="22" fill="#183b62"/><text x="600" y="90" fill="#fff" font-size="34" font-weight="700">Human authority</text><text x="600" y="132" fill="#dbe8f4" font-size="23">Intent - security - public claims - risk - release</text><path d="M410 360V190M790 360V190" stroke="#39729f" stroke-width="9"/><rect x="55" y="360" width="520" height="155" rx="22" fill="#fff" stroke="#39729f" stroke-width="5"/><rect x="625" y="360" width="520" height="155" rx="22" fill="#fff" stroke="#39729f" stroke-width="5"/><text x="315" y="418" fill="#0c2442" font-size="32" font-weight="700">AI contribution</text><text x="315" y="460" fill="#40526a" font-size="22">Orchestration - implementation - challenge</text><text x="885" y="418" fill="#0c2442" font-size="32" font-weight="700">Evidence</text><text x="885" y="460" fill="#40526a" font-size="22">Source - tests - runtime - live checks</text><text x="600" y="255" fill="#a33f2b" font-size="25" font-weight="700">Informs adjudication; does not transfer authority</text></g>
</svg>
