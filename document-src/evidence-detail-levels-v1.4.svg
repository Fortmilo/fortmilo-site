<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" rx="28" fill="#f4f7fb"/>
  <text x="50" y="58" fill="#10213a" font-family="Arial, sans-serif" font-size="27" font-weight="700">One 20-family scanner plan, three evidence detail levels</text>
  <text x="50" y="94" fill="#42536b" font-family="Arial, sans-serif" font-size="18">The selected level changes retained detail, not which scanner families are planned.</text>
  <g font-family="Arial, sans-serif">
    <rect x="50" y="130" width="330" height="310" rx="18" fill="#ffffff" stroke="#8190a6" stroke-width="3"/>
    <text x="78" y="178" fill="#10213a" font-size="24" font-weight="700">Top Issues</text>
    <text x="78" y="220" fill="#42536b" font-size="18">Same 20-family plan</text>
    <text x="78" y="260" fill="#42536b" font-size="18">No assignment rows</text>
    <text x="78" y="294" fill="#42536b" font-size="18">No assignment-summary rows</text>
    <text x="78" y="344" fill="#9b3d28" font-size="17" font-weight="700">Not retained at this</text>
    <text x="78" y="370" fill="#9b3d28" font-size="17" font-weight="700">evidence level</text>

    <rect x="435" y="130" width="330" height="310" rx="18" fill="#ffffff" stroke="#42719a" stroke-width="3"/>
    <text x="463" y="178" fill="#10213a" font-size="24" font-weight="700">Balanced</text>
    <text x="463" y="220" fill="#42536b" font-size="18">Same 20-family plan</text>
    <text x="463" y="260" fill="#42536b" font-size="18">Holding summaries only</text>
    <text x="463" y="310" fill="#9b3d28" font-size="17" font-weight="700">Individual assignment</text>
    <text x="463" y="336" fill="#9b3d28" font-size="17" font-weight="700">identities: Not captured</text>

    <rect x="820" y="130" width="330" height="310" rx="18" fill="#fff8ef" stroke="#c55a2e" stroke-width="4"/>
    <text x="848" y="178" fill="#10213a" font-size="24" font-weight="700">Everything</text>
    <text x="848" y="220" fill="#42536b" font-size="18">Same 20-family plan</text>
    <text x="848" y="260" fill="#42536b" font-size="18">Holding summaries</text>
    <text x="848" y="294" fill="#42536b" font-size="18">Bounded assignment rows</text>
    <text x="848" y="344" fill="#9b3d28" font-size="17" font-weight="700">Deepest supported level,</text>
    <text x="848" y="370" fill="#9b3d28" font-size="17" font-weight="700">not exhaustive or unlimited</text>
  </g>
  <path d="M380 285H427" stroke="#c55a2e" stroke-width="5"/>
  <path d="M765 285H812" stroke="#c55a2e" stroke-width="5"/>
</svg>
