<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-gated delivery cycle</title><desc id="desc">Nine states move from human intent through bounded implementation and proof to release, live verification and governance close-out. Challenge may return work to an earlier state.</desc>
  <rect width="1200" height="640" rx="28" fill="#f2f6fa"/><g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
  <path d="M350 145H450M750 145H850M1000 220V300M850 375H750M450 375H350M200 450V520M350 565H450M750 565H850" stroke="#39729f" stroke-width="8" fill="none"/>
  <path d="M900 520C900 465 865 425 800 405" stroke="#d94b31" stroke-width="7" fill="none" stroke-dasharray="14 10"/>
  <g fill="#fff" stroke="#183b62" stroke-width="4"><rect x="50" y="70" width="300" height="150" rx="18"/><rect x="450" y="70" width="300" height="150" rx="18"/><rect x="850" y="70" width="300" height="150" rx="18"/><rect x="850" y="300" width="300" height="150" rx="18"/><rect x="450" y="300" width="300" height="150" rx="18"/><rect x="50" y="300" width="300" height="150" rx="18"/><rect x="50" y="500" width="300" height="110" rx="18"/><rect x="450" y="500" width="300" height="110" rx="18"/><rect x="850" y="500" width="300" height="110" rx="18"/></g>
  <g fill="#0c2442" font-size="28" font-weight="700"><text x="200" y="125"><tspan x="200">1. Human-owned</tspan><tspan x="200" dy="38">intent</tspan></text><text x="600" y="125"><tspan x="600">2. Bounded issue</tspan><tspan x="600" dy="38">contract</tspan></text><text x="1000" y="125"><tspan x="1000">3. AI-assisted</tspan><tspan x="1000" dy="38">implementation</tspan></text><text x="1000" y="355"><tspan x="1000">4. Automated</tspan><tspan x="1000" dy="38">proof</tspan></text><text x="600" y="347"><tspan x="600">5. Role-separated</tspan><tspan x="600" dy="36">adversarial</tspan><tspan x="600" dy="36">challenge</tspan></text><text x="200" y="355"><tspan x="200">6. Human</tspan><tspan x="200" dy="38">adjudication</tspan></text><text x="200" y="570">7. Release gate</text><text x="600" y="570">8. Live verification</text><text x="1000" y="552"><tspan x="1000">9. Governance</tspan><tspan x="1000" dy="36">close-out</tspan></text></g></g>
