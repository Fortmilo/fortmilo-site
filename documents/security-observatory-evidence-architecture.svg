<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#143555"/></marker><marker id="redarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d32432"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="70" y="58" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#16324f" text-anchor="start">Salesforce-native evidence architecture</text><text x="70" y="84" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#60758d" text-anchor="start">Read-only assessment of Salesforce configuration, subscriber-controlled authentication and explicit evidence boundaries</text><rect x="50" y="88" width="1320" height="760" rx="20" fill="none" stroke="#60758d" stroke-width="2.5" stroke-dasharray="10 8"/><text x="70" y="116" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#60758d" text-anchor="start">SUBSCRIBER SALESFORCE ORGANISATION - TRUST BOUNDARY</text><rect x="90" y="145" width="230" height="90" rx="12" fill="#f3f7fa" stroke="#8da6b8" stroke-width="2"/><text x="205.0" y="187" font-family="Liberation Sans, Arial, sans-serif" font-size="20.0" font-weight="700" fill="#16324f" text-anchor="middle">Authorised operator</text><text x="205.0" y="213" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#60758d" text-anchor="middle">or approved schedule</text><rect x="360" y="145" width="270" height="90" rx="12" fill="#f3f7fa" stroke="#8da6b8" stroke-width="2"/><text x="495.0" y="187" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" fill="#16324f" text-anchor="middle">Lightning Web Components</text><text x="495.0" y="213" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#60758d" text-anchor="middle">dashboard and review surface</text><rect x="680" y="145" width="220" height="90" rx="12" fill="#f3f7fa" stroke="#8da6b8" stroke-width="2"/><text x="790.0" y="187" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#16324f" text-anchor="middle">Apex controller</text><text x="790.0" y="213" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#60758d" text-anchor="middle">and scan service</text><rect x="950" y="145" width="255" height="90" rx="12" fill="#e9f5fa" stroke="#2d7ea5" stroke-width="2"/><text x="1077.5" y="187" font-family="Liberation Sans, Arial, sans-serif" font-size="19.5" font-weight="700" fill="#16324f" text-anchor="middle">Canonical scanner plan</text><text x="1077.5" y="213" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#60758d" text-anchor="middle">bounded asynchronous segments</text><line x1="320" y1="190" x2="360" y2="190" stroke="#143555" stroke-width="3" marker-end="url(#arrow)"/><text x="340" y="136" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#60758d" text-anchor="middle">invoke</text><line x1="630" y1="190" x2="680" y2="190" stroke="#143555" stroke-width="3" marker-end="url(#arrow)"/><text x="655" y="136" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#60758d" text-anchor="middle">call</text><line x1="900" y1="190" x2="950" y2="190" stroke="#143555" stroke-width="3" marker-end="url(#arrow)"/><text x="925" y="136" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#60758d" text-anchor="middle">execute</text><text x="90" y="312" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#16324f" text-anchor="start">Evidence sources</text><rect x="90" y="350" width="360" height="105" rx="12" fill="#f3f7fa" stroke="#8da6b8" stroke-width="2"/><text x="270.0" y="392" font-family="Liberation Sans, Arial, sans-serif" font-size="18.0" font-weight="700" fill="#16324f" text-anchor="middle">Salesforce record and setup sources</text><text x="270.0" y="418" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#60758d" text-anchor="middle">SOQL, setup objects and approved metadata</text><text x="270.0" y="440" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#60758d" text-anchor="middle">read-only acquisition within defined scope</text><rect x="515" y="350" width="380" height="105" rx="12" fill="#f3f7fa" stroke="#8da6b8" stroke-width="2"/><text x="705.0" y="392" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#16324f" text-anchor="middle">Same-organisation Tooling API self-callout</text><text x="705.0" y="418" font-family="Liberation Sans, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#60758d" text-anchor="middle">subscriber-configured Named / External Credential</text><text x="705.0" y="440" font-family="Liberation Sans, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#60758d" text-anchor="middle">authenticated only for approved metadata sources</text><rect x="960" y="350" width="325" height="105" rx="12" fill="#e9f5fa" stroke="#2d7ea5" stroke-width="2"/><text x="1122.5" y="392" font-family="Liberation Sans, Arial, sans-serif" font-size="15.0" font-weight="700" fill="#16324f" text-anchor="middle">Normalisation and safe-reason mapping</text><text x="1122.5" y="418" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#60758d" text-anchor="middle">bounded categories and next actions</text><text x="1122.5" y="440" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#60758d" text-anchor="middle">raw diagnostics are not retained evidence</