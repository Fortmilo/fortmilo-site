ext-anchor="middle">Review outputs</text><text x="1127.5" y="623" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#60758d" text-anchor="middle">dashboard / safe drill-down / compatible comparison</text><text x="1127.5" y="645" font-family="Liberation Sans, Arial, sans-serif" font-size="14.0" font-weight="400" fill="#60758d" text-anchor="middle">user-initiated CSV generation inside Salesforce</text><line x1="885" y1="620" x2="960" y2="620" stroke="#143555" stroke-width="3" marker-end="url(#arrow)"/><text x="922.5" y="610.0" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#60758d" text-anchor="middle">review</text><rect x="1410" y="575" width="145" height="95" rx="12" fill="#f3f7fa" stroke="#9ca9b3" stroke-width="2"/><text x="1482.5" y="617" font-family="Liberation Sans, Arial, sans-serif" font-size="18.0" font-weight="700" fill="#16324f" text-anchor="middle">Downloaded</text><text x="1482.5" y="643" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#60758d" text-anchor="middle">sanitised CSV</text><text x="1482.5" y="665" font-family="Liberation Sans, Arial, sans-serif" font-size="13.0" font-weight="400" fill="#60758d" text-anchor="middle">outside Salesforce</text><line x1="1295" y1="620" x2="1410" y2="620" stroke="#d32432" stroke-width="3" marker-end="url(#redarrow)"/><text x="1482" y="556" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#60758d" text-anchor="middle">explicit user action</text><text x="90" y="760" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#60758d" text-anchor="start">RELATIONSHIP LEGEND</text><line x1="320" y1="755" x2="385" y2="755" stroke="#143555" stroke-width="3" marker-end="url(#arrow)"/><text x="400" y="760" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#60758d" text-anchor="start">internal execution / evidence flow</text><line x1="735" y1="755" x2="800" y2="755" stroke="#d32432" stroke-width="3" marker-end="url(#redarrow)"/><text x="815" y="760" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#60758d" text-anchor="start">explicit user-initiated boundary crossing</text><text x="90" y="806" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#60758d" text-anchor="start">No external FortMilo evidence service. No automatic remediation. No stored credential values are shown.</text><text x="90" y="830" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#60758d" text-anchor="start">The only data-bearing trust-boundary crossing shown is the explicit download of sanitised CSV initiated by the user.</text></svg>